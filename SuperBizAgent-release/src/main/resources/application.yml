server:
  port: 9900
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

file:
  upload:
    path: ./uploads
    allowed-extensions: txt,md,pdf,docx,html,htm,csv,json

milvus:
  host: localhost
  port: 19530
  username: ""
  password: ""
  database: default
  timeout: 10000

# Spring AI Alibaba DashScope 配置
spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  ai:
    dashscope:
      api-key: ${QWEN_KEY}  # 从环境变量读取或使用默认值
      chat:
        options:
          model: qwen-max  # 大语言模型名称
          timeout: 180000  # 超时时间180秒（3分钟）
      retry:
        max-attempts: 3  # 最大重试次数
        backoff:
          initial-interval: 2000  # 初始重试间隔2秒
          multiplier: 2  # 重试间隔倍数
          max-interval: 10000  # 最大重试间隔10秒
    
    # Spring AI MCP 客户端配置
    # 如果使用mock数据，请注释这部分内容
    mcp:
      client:
        enabled: true
        name: tencent-mcp-server
        version: 1.0.0
        request-timeout: 60s
        type: ASYNC
        sse:
          connections:
            tencent-cls:
              url: http://localhost:3000
              sse-endpoint: /sse  # 完整的SSE端点路径

# 阿里云 DashScope Embedding API 配置
dashscope:
  api:
    key: ${QWEN_KEY}  # 从环境变量读取或使用默认值（用于自定义配置）
  embedding:
    model: text-embedding-v4  # 阿里云文本向量化模型
    cache:
      max-size: 500            # 最大缓存条目数（防止内存溢出）
      expire-after-write: 24h  # 写入后过期时间（向量不会频繁变化）

document:
  chunk:
    max-size: 800   # 每个分片最大字符数
    overlap: 100    # 分片之间的重叠字符数
    csv-rows-per-chunk: 5  # CSV文件每组行数（一组数据合并为一个chunk）

# RAG 配置
rag:
  top-k: 3          # 最终保留给 LLM 的最相关文档数量
  recall-k: 6      # 向量检索宽召回数量（给重排模型提供更多候选）
  model: "qwen3-max"  # 大语言模型名称
  rerank:
    enabled: true      # 是否启用重排（true=启用, false=关闭）
    model: "gte-rerank" # 重排模型名称
    max-doc-length: 4000  # 单篇文档最大字符数（超过会被截断）

# Prometheus 配置
prometheus:
  base-url: http://localhost:9090
  timeout: 10  # 超时时间（秒）
  mock-enabled: false  # 是否启用 Mock 模式（用于测试）

# CLS 云日志服务配置
cls:
  mock-enabled: false  # 是否启用 Mock 模式（用于测试，设为 true 返回与告警关联的模拟日志数据）

# 上下文窗口压缩配置（对话摘要+滑动窗口）
context:
  compression:
    enabled: true                 # 是否启用历史压缩
    threshold: 2                  # 超过多少对消息触发压缩
    keep-recent-pairs: 1          # 压缩后保留的最近消息对数
    summary-max-tokens: 300       # 摘要的最大 token 数
